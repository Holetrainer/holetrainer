<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t('brand') }} — {{ t('login_title') }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    (function() {
      const saved = localStorage.getItem('holetrainer-theme');
      if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand" style="padding:0 0 2px;">{{ t('brand') }}</div>
      <div class="brand-sub" style="margin-bottom:12px;">{{ t('brand_sub') }}</div>
      <h1>{{ t('login_title') }}</h1>
      <p class="subtitle">{{ t('login_subtitle') }}</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-group">
          <label class="field-label">{{ t('username_label') }}</label>
          <input type="text" name="username" class="text-input" required autofocus>
        </div>
        <div class="form-group">
          <label class="field-label">{{ t('password_label') }}</label>
          <input type="password" name="password" class="text-input" required>
        </div>
        <button type="submit" class="primary" style="width:100%;">{{ t('sign_in_btn') }}</button>
      </form>
    </div>
  </div>
</body>
</html>
